services:
  mariadb:
    image: mariadb:10.6
    container_name: smartroom_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartroomms
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ./PhongTro40_AI
      dockerfile: Dockerfile
    container_name: smartroom_ai
    environment:
      - DB_HOST=mariadb
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=smartroomms
      - DB_PORT=3306
    ports:
      - "8000:8000"
    depends_on:
      mariadb:
        condition: service_healthy

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: smartroom_backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:mariadb://mariadb:3306/smartroomms
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - AI_SERVICE_URL=http://ai:8000
      - MANAGEMENT_HEALTH_MAIL_ENABLED=false
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      ai:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartroom_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
